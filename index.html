  base.id='baseDataPanel';base.className='data-mode-panel';base.setAttribute('role','tabpanel');
  existing.forEach(function(node){base.appendChild(node)});
  var progressions=document.createElement('section');
  progressions.id='precalculatedProgressionsPanel';progressions.className='data-mode-panel';progressions.setAttribute('role','tabpanel');progressions.hidden=true;
  progressions.innerHTML='<div class="precalc-intro"><div><h3>Progressions minimales précalculées</h3><p class="hint">Chaque référence repart après un prestige avec les monnaies et les boutiques remises à zéro. Les achats d’une ligne sont conservés pour les étapes suivantes.</p></div><span class="precalc-status">calculées une seule fois</span></div><div class="precalc-pr-tabs" id="precalcPrTabs" role="tablist"></div><div class="precalc-meta" id="precalcMeta"></div><div class="data-table-wrap precalc-table-wrap"><table class="data-table precalc-table"><thead><tr><th>Étape</th><th>Stats minimales après achat</th><th>Achats de l’étape</th><th>Coût de l’étape</th><th>Total cumulé</th></tr></thead><tbody id="precalcProgressionRows"></tbody></table></div>';
  body.appendChild(nav);body.appendChild(base);body.appendChild(progressions);

  var ranks=Object.keys(data).map(Number).sort(function(a,b){return a-b});
  var tabs=progressions.querySelector('#precalcPrTabs');
  var rows=progressions.querySelector('#precalcProgressionRows');
  var meta=progressions.querySelector('#precalcMeta');
  var tierIcons=[icons.blue,icons.ice,icons.sun,icons.umbrella];
  var tierColors=['#55baff','#ff9ac8','#ffd166','#ff6b6b'];
  function number(value,digits){return Number(value).toLocaleString('fr-FR',{minimumFractionDigits:digits,maximumFractionDigits:digits})}
  function statLine(record,previous,rank){
    var s=record.stats,m=record.mods,ps=previous?previous.stats:{ad:10,hp:100,as:1,ms:1,gs:1,critChance:0,critDamage:2,blockChance:0,dropChance:0},pm=previous?previous.mods:{ad:0,as:0,critChance:0,critDamage:0},previousMultiplier=previous?previous.multiplier:1+rank*.1,lines=[];
    function differs(a,b){return Math.abs((Number(a)||0)-(Number(b)||0))>.000001}
    function add(label,value,changed){lines.push('<div class="precalc-stat-line'+(changed?' changed':'')+'"><span>'+label+'</span><span>'+value+'</span></div>')}
    add('Max HP',number(s.hp,0),differs(s.hp,ps.hp));
    add('Attack Damage',number(s.ad,0),differs(s.ad,ps.ad));
    add('Attack Speed',number(s.as,2),differs(s.as,ps.as));
    add('Move Speed',number(s.ms,2),differs(s.ms,ps.ms));
    if(s.critChance>0){
      add('CC · CD',number(s.critChance*100,0)+' % · × '+number(s.critDamage,2),differs(s.critChance,ps.critChance)||differs(s.critDamage,ps.critDamage)||ps.critChance<=0);
    }
    add('Event Speed',number(s.gs,2),differs(s.gs,ps.gs));
    if(s.blockChance>0)add('Block Chance',number(s.blockChance*100,0)+' %',differs(s.blockChance,ps.blockChance));
    if(record.multiplier>1)add('Prestige HP/Dmg','× '+number(record.multiplier,2),differs(record.multiplier,previousMultiplier));
    if(s.dropChance>0)add('5× Currencies',number(s.dropChance*100,0)+' %',differs(s.dropChance,ps.dropChance));
    if(m.ad>0)add('Enemy AD','−'+number(m.ad,0),differs(m.ad,pm.ad));
    if(m.as>0)add('Enemy AS','−'+number(m.as,2),differs(m.as,pm.as));
    if(m.critChance>0||m.critDamage>0)add('Enemy CC · CD',(m.critChance>0?'−'+number(m.critChance,0)+' %':'0 %')+' · '+(m.critDamage>0?'−'+number(m.critDamage,2):'0'),differs(m.critChance,pm.critChance)||differs(m.critDamage,pm.critDamage));
    return lines.join('');
  }
  function costs(values){
    var output=values.map(function(value,index){return value?'<span class="precalc-cost" style="color:'+tierColors[index]+'"><img src="'+tierIcons[index]+'" alt="T'+(index+1)+'">'+Number(value).toLocaleString('fr-FR')+'</span>':''}).filter(Boolean);
    return output.join('')||'—';
  }
  function purchases(record){
    if(!record.purchases||!record.purchases.length)return '—';
    return record.purchases.map(function(purchase){
      var tier=Number(purchase.tier),index=Number(purchase.index),tierLevels=record.levels[String(tier)]||record.levels[tier]||[],toLevel=Number(tierLevels[index])||0,fromLevel=Math.max(0,toLevel-(Number(purchase.count)||0)),item=DATA.upgrade.tiers[tier]&&DATA.upgrade.tiers[tier][index],name=item?shortUpgradeName(item[0]):purchase.name;
      name=name.replace(/Enemy Crit(?: Chance)? · Enemy Crit Damage/g,'Enemy CC · CD').replace(/Crit Damage · Enemy Crit Damage/g,'CD · Enemy CD').replace(/Crit Chance · Crit Damage/g,'CC · CD');
      return '<div class="precalc-purchase"><img src="'+tierIcons[tier-1]+'" alt="T'+tier+'"><span class="precalc-purchase-name" style="color:'+tierColors[tier-1]+'">'+name+'</span><span class="precalc-level">niv. '+fromLevel+' → '+toLevel+'</span></div>';
    }).join('');
  }
  function renderRank(rank){
    var pack=data[rank],records=pack.records,target=Number(pack.config&&pack.config.maxWave)||records[records.length-1].wave,verifiedTarget=records[records.length-1].wave;
    tabs.querySelectorAll('button').forEach(function(button){var active=Number(button.dataset.pr)===rank;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active))});
    var reached=rank<40?target+1:target;
    meta.innerHTML='<span><b>Référence PR'+rank+'</b></span><span>Objectif V'+reached+' · vérifiée jusqu’à V'+verifiedTarget+'</span><span>'+records.length+' étapes</span>'+(pack.excludedRecords?'<span>'+pack.excludedRecords+' lignes obsolètes écartées</span>':'')+'<span>seuil fiable ≥ 51 %</span>';
    var cumulative=[0,0,0,0];
    rows.innerHTML=records.map(function(record,index){
      cumulative=cumulative.map(function(value,index){return value+(Number(record.spent[index])||0)});
      return '<tr><td><b>Clear V'+record.wave+'</b><br><span class="hint">atteindre V'+(record.wave+1)+'</span></td><td>'+statLine(record,records[index-1]||null,rank)+'</td><td>'+purchases(record)+'</td><td>'+costs(record.spent)+'</td><td>'+costs(cumulative)+'</td></tr>';
    }).join('');
  }
  tabs.innerHTML=ranks.map(function(rank,index){var records=data[rank].records,target=Number(data[rank].config&&data[rank].config.maxWave)||records[records.length-1].wave,reached=rank<40?target+1:target,label=rank<40?'atteindre V'+reached:'terminer V'+target;return '<button class="precalc-pr-tab'+(index===0?' active':'')+'" type="button" data-pr="'+rank+'" role="tab" aria-selected="'+(index===0?'true':'false')+'">PR'+rank+' → '+label+'</button>'}).join('');
  tabs.addEventListener('click',function(event){var button=event.target.closest('[data-pr]');if(button)renderRank(Number(button.dataset.pr))});
  nav.addEventListener('click',function(event){var button=event.target.closest('[data-data-mode]');if(!button)return;var mode=button.dataset.dataMode;nav.querySelectorAll('button').forEach(function(item){var active=item===button;item.classList.toggle('active',active);item.setAttribute('aria-selected',String(active))});base.hidden=mode!=='base';progressions.hidden=mode!=='progressions'});
  renderRank(ranks[0]);
});
</script>

  const clearResult=()=>{document.querySelector('.metrics')?.classList.add('awaiting-simulation');for(const id of ['runTime','blueMin','rateTier2','rateTier3','rateTier4']){const element=document.getElementById(id);if(element)element.textContent='—'}for(let tier=2;tier<=4;tier++){const card=document.getElementById('rateCard'+tier);if(card)card.style.display='none'}const deathAt=document.getElementById('deathAt'),deathChance=document.getElementById('deathChance'),deathInfo=document.getElementById('deathInfo'),deathOdds=document.getElementById('deathOdds'),plan=document.getElementById('plan'),simulation=document.getElementById('simulateButton'),afk=document.getElementById('afkButton');if(deathAt)deathAt.textContent='—';if(deathChance)deathChance.textContent='';if(deathInfo)deathInfo.textContent='No saved simulation for this profile.';if(deathOdds)deathOdds.innerHTML='';if(plan)plan.innerHTML='<div class="empty">Click Simulate to calculate this profile.</div>';document.getElementById('speedAlternative')?.remove();if(simulation){simulation.disabled=false;simulation.textContent='Simulate';simulation.style.background='#183a5b';simulation.style.opacity='1'}if(afk){afk.disabled=false;afk.textContent='Simulate AFK · 8 h'}window.unifiedRouteChoice=null;window.combinedRouteChoice=null};
  const restoreResult=profile=>{const cached=resultCache.get(profile),card=resultCard(),prediction=document.getElementById('predictionCard');if(!cached||!card){clearResult();return}card.innerHTML=cached.html;if(prediction&&cached.predictionHtml)prediction.innerHTML=cached.predictionHtml;window.unifiedRouteChoice=cached.unifiedRouteChoice;window.combinedRouteChoice=cached.combinedRouteChoice;window.ensureCurrencyRateCards?.();window.bindAfkButton?.()};

<script>
(()=>{
  const ACTIVE_KEY='obelisk-active-profile',PROFILE_PREFIX='obelisk-profile-',REVISION_PREFIX='obelisk-profile-cloud-revision-',APPLIED_PREFIX='obelisk-cloud-applied-',LOCK_PREFIX='obelisk-cloud-locked-';
  const activeProfile=()=>localStorage.getItem(ACTIVE_KEY)||'frenswa';
  const isProfileStateKey=key=>key.startsWith('obelisk-')&&key!==ACTIVE_KEY&&!key.startsWith(PROFILE_PREFIX)&&!key.includes('cache')&&!key.includes('marginal')&&!key.includes('route-table');
  const collectState=()=>{const state={};for(let index=0;index<localStorage.length;index++){const key=localStorage.key(index);if(key&&isProfileStateKey(key))state[key]=localStorage.getItem(key)}return state};
  const replaceState=(profile,state)=>{const keys=[];for(let index=0;index<localStorage.length;index++){const key=localStorage.key(index);if(key&&isProfileStateKey(key))keys.push(key)}keys.forEach(key=>localStorage.removeItem(key));Object.entries(state||{}).forEach(([key,value])=>{if(isProfileStateKey(key)&&typeof value==='string')localStorage.setItem(key,value)});localStorage.setItem(PROFILE_PREFIX+profile,JSON.stringify(state||{}));localStorage.setItem(ACTIVE_KEY,profile)};
  const revisionOf=profile=>Math.max(0,Math.floor(Number(localStorage.getItem(REVISION_PREFIX+profile))||0));
  const setRevision=(profile,revision)=>localStorage.setItem(REVISION_PREFIX+profile,String(Math.max(0,Math.floor(Number(revision)||0))));
  const lockKey=profile=>LOCK_PREFIX+profile,isLocked=profile=>sessionStorage.getItem(lockKey(profile))!==null,lockProfile=(profile,revision)=>sessionStorage.setItem(lockKey(profile),String(Math.max(0,Number(revision)||0))),unlockProfile=profile=>sessionStorage.removeItem(lockKey(profile));
  const switcher=document.getElementById('profileSwitcher');if(!switcher)return;
  const cloudButton=document.createElement('button');cloudButton.type='button';cloudButton.className='cloud-sync-button';cloudButton.textContent='Cloud';cloudButton.title='Connect cloud profiles';switcher.append(cloudButton);
  const setStatus=(text,kind='',title='')=>{cloudButton.textContent=text;cloudButton.className='cloud-sync-button'+(kind?' '+kind:'');cloudButton.title=title||text;cloudButton.disabled=kind==='working'};
  const statesEqual=(left,right)=>JSON.stringify(left||{})===JSON.stringify(right||{});

  async function request(path,options={}){
    const response=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});
    let data={};try{data=await response.json()}catch{}
    return{response,data}
  }

  async function login(){
    const password=prompt('Cloud sync password');if(password===null)return false;
    setStatus('Signing in','working');
    try{const{response,data}=await request('/api/login',{method:'POST',body:JSON.stringify({password})});if(!response.ok){setStatus(response.status===503?'Setup needed':'Wrong password','error',data.error);return false}return true}catch(error){console.error(error);setStatus('Offline','error','Cloud unavailable');return false}
  }

  async function loadCloudProfile(allowLogin=false,{simulate=false}={}){
    const profile=activeProfile();setStatus('Syncing','working');
    try{
      let result=await request('/api/profiles/'+profile);
      if(result.response.status===401&&allowLogin&&await login())result=await request('/api/profiles/'+profile);
      if(result.response.status===401){setStatus('Cloud login','','Click to connect cloud sync');return false}
      if(!result.response.ok){setStatus(result.response.status===503?'Setup needed':'Sync error','error',result.data.error);return false}
      const remoteState=result.data.state||{},remoteRevision=Math.max(0,Number(result.data.revision)||0),localState=collectState();
      setRevision(profile,remoteRevision);unlockProfile(profile);
      if(remoteRevision===0&&Object.keys(remoteState).length===0){
        const saved=await saveCloudProfile(false);if(saved)setStatus('Synced','online','Saved online');return saved
      }
      if(!statesEqual(localState,remoteState)){
        const appliedKey=APPLIED_PREFIX+profile;
        if(sessionStorage.getItem(appliedKey)!==String(remoteRevision)){
          replaceState(profile,remoteState);sessionStorage.setItem(appliedKey,String(remoteRevision));window.invalidateProfileResult?.(profile);await window.applyActiveProfileState?.(profile,{simulate});if(!simulate)window.clearActiveProfileResult?.();return true
        }
      }
      setStatus('Synced','online','Verified cloud revision '+remoteRevision);return true
    }catch(error){console.error(error);setStatus('Offline','error','Local data is still available');return false}
  }

  async function saveCloudProfile(allowLogin=true){
    const profile=activeProfile();if(isLocked(profile)){setStatus('Save protected','error','A newer verified cloud save is protected. Click Cloud to load it.');return false}setStatus('Saving','working');
    try{
      let result=await request('/api/profiles/'+profile,{method:'PUT',body:JSON.stringify({state:collectState(),baseRevision:revisionOf(profile)})});
      if(result.response.status===401&&allowLogin&&await login())result=await request('/api/profiles/'+profile,{method:'PUT',body:JSON.stringify({state:collectState(),baseRevision:revisionOf(profile)})});
      if(result.response.status===401){setStatus('Cloud login','','Click to connect cloud sync');return false}
      if(result.response.status===409){
        const protectedRevision=Math.max(0,Number(result.data.revision)||0);lockProfile(profile,protectedRevision);setStatus('Save protected','error','Verified cloud revision '+protectedRevision+' is newer than this tab');
        if(confirm('A newer verified cloud save exists. This old tab is blocked from overwriting it.\n\nOK: load the protected cloud save\nCancel: keep local changes, but cloud saving stays blocked')){setRevision(profile,protectedRevision);replaceState(profile,result.data.state||{});sessionStorage.setItem(APPLIED_PREFIX+profile,String(protectedRevision));unlockProfile(profile);window.invalidateProfileResult?.(profile);await window.applyActiveProfileState?.(profile,{simulate:false});window.clearActiveProfileResult?.();setStatus('Synced','online','Loaded verified cloud revision '+protectedRevision)}
        return false
      }
      if(!result.response.ok){setStatus(result.response.status===503?'Setup needed':'Save error','error',result.data.error);return false}
      setRevision(profile,result.data.revision);unlockProfile(profile);localStorage.setItem(PROFILE_PREFIX+profile,JSON.stringify(collectState()));setStatus('Synced','online','Verified cloud revision '+result.data.revision);return true
    }catch(error){console.error(error);setStatus('Offline','error','Saved locally; cloud unavailable');return false}
  }

  const localSave=window.saveAllStats;
  window.saveAllStats=async function(button){localSave?.(button);await new Promise(resolve=>setTimeout(resolve,80));const saved=await saveCloudProfile(true);if(button&&saved){button.textContent='✓ Saved Online';button.style.background='#23845f'}return saved};
  window.loadCloudProfile=loadCloudProfile;window.saveCloudProfile=saveCloudProfile;
  cloudButton.addEventListener('click',()=>loadCloudProfile(true));
  loadCloudProfile(false);
})();
</script>

<script id="engineIntegration">
(function(){
  var engine=window.ObeliskEngine;if(!engine?.combat||!engine?.economy||!engine?.route)return;
  var progressionData=window.OBELISK_PRECALCULATED_PROGRESSIONS;
  if(progressionData){
    var sanitized=engine.route.sanitizeProgressions(progressionData,{tiers:DATA.upgrade.tiers,growth:DATA.upgrade.growth});
    window.OBELISK_PRECALCULATED_AUDIT=sanitized.invalid;
    window.precalculatedMilestoneFor=function(pr){var ranks=Object.keys(progressionData).map(Number).filter(function(rank){return rank<=pr}).sort(function(a,b){return b-a});if(!ranks.length)return null;var rank=ranks[0],pack=progressionData[rank],records=pack.records,wave=(Number(pack.config&&pack.config.maxWave)||records[records.length-1].wave)+1;return{rank:rank,wave:wave}}
  }
  function runCombat(stats,maxWave,stochastic,seed,gauge){
    var result=engine.combat.simulateRun({rules:DATA,stats:stats,reductions:enemyMods(),maxWave:maxWave||250,stochastic:stochastic,seed:seed,playerGaugePercent:gauge});
    result.blue=engine.economy.rewardsForWave(result.lastWave)[0];
    return result
  }
  simulate=function(stats,maxWave){return runCombat(stats,maxWave,false,0,50)};
  simulateChance=function(stats,gauge,seed,maxWave){return runCombat(stats,maxWave,true,seed,gauge)};

  function installEconomy(){
    window.rewardsForWave=function(completed){return engine.economy.rewardsForWave(completed)};
    window.dropExpectedMultiplier=function(stats){return engine.economy.dropExpectedMultiplier((stats||effectiveStats()).dropChance)};
    window.expectedRewardsForWave=function(completed,stats){stats=stats||effectiveStats();return engine.economy.expectedRewards(completed,{dropChance:stats.dropChance,currencyMultiplier:stats.currencyMultiplier})};
    blueTo=function(wave){return engine.economy.rewardsForWave(wave)[0]}
  }
  if(document.readyState==='loading')addEventListener('DOMContentLoaded',installEconomy,{once:true});else installEconomy();

  var baseRouteRender=window.renderUnifiedRoute;
  if(typeof baseRouteRender==='function')window.renderUnifiedRoute=async function(){
    await baseRouteRender.apply(this,arguments);
    var result=window.unifiedRouteChoice,plan=document.getElementById('plan');if(!result?.choice||!plan)return;
    var validation=engine.route.validateRouteState({tiers:DATA.upgrade.tiers,growth:DATA.upgrade.growth,prestigeRank:currentPrestigeRank(),startLevels:currentLevels(),finalLevels:result.choice.levels,expectedSpent:result.choice.spent});
    result.engineValidation=validation;
    if(!validation.valid){
      console.error('Rejected invalid route',validation.errors);
      plan.innerHTML='<div class="route-engine-status invalid">Route refusée par la vérification des boutiques</div><div class="empty">Une incohérence de niveau, de prérequis, de cap ou de coût a été détectée. Relance la simulation.</div>';
      window.unifiedRouteChoice=null;
      return
    }
    var source=engine.route.routeSource(result),status=document.createElement('div');status.className='route-engine-status verified';status.textContent='Source : '+source.label+' · route vérifiée';plan.prepend(status)
  };
  window.ObeliskEngineIntegration={version:'1.0.0',installEconomy:installEconomy}
})();
</script>
